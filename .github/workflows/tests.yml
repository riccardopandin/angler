name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # No ANTHROPIC_API_KEY is configured here on purpose. The whole suite,
      # including the 40 prompt-injection cases, runs offline against a model
      # stub that is assumed to be fully compromised.
      - run: pytest -q
